
difft-coroutines:
  active: true

  BanRunBlockingOutsideTests:
    active: true
    excludes:
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/src/testFixtures/**'

  BlockingWcdbInSuspend:
    active: true
    excludes:
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/src/testFixtures/**'

  BlockingSharedPrefsInSuspend:
    active: true
    excludes:
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/src/testFixtures/**'

  PrepareSelectMissingSelect:
    active: true
    excludes:
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/src/testFixtures/**'

  UnsafeWcdbConflictInsert:
    active: true
    excludes:
      - '**/src/test/**'
      - '**/src/androidTest/**'
      - '**/src/testFixtures/**'

  LifecycleScopeBlockingCall:
    active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  InjectDispatcher:
    active: false

performance:
  active: true
  ForEachOnRange:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true
  SpreadOperator:
    active: true

complexity:
  active: true
  LargeClass:
    active: true
    allowedLines: 500       # ← matches CLAUDE.md hard rule
  LongMethod:
    active: true
    allowedLines: 100       # lenient initial value; tighten later
  LongParameterList:
    active: true
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
  TooManyFunctions:
    active: false           # Default threshold 11 is too aggressive for our codebase
  CyclomaticComplexMethod:
    active: false           # Subjective, adds noise without action
  CognitiveComplexMethod:
    active: false
  NestedBlockDepth:
    active: false
  NestedScopeFunctions:
    active: false
  ComplexCondition:
    active: false
  ComplexInterface:
    active: false
  MethodOverloading:
    active: false
  StringLiteralDuplication:
    active: false
  LabeledExpression:
    active: false
  ReplaceSafeCallChainWithRun:
    active: false
  NamedArguments:
    active: false

style:
  active: false

naming:
  active: false

comments:
  active: false

empty-blocks:
  active: false

exceptions:
  active: false

potential-bugs:
  active: false
