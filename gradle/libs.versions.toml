[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
# KSP replaces kapt for all annotation processing (Hilt, WCDB, Glide). KSP 2.3.9
# is AGP-9-built-in-Kotlin-aware; earlier 2.3.x reject the built-in Kotlin.
