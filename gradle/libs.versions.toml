[versions]
# Kotlin
kotlin = "2.3.0"
kotlinCoroutine = "1.11.0"
# KSP — 2.3.9 is the confirmed-good floor: it is the AGP-9-built-in-Kotlin-aware
# release. Earlier 2.3.x (e.g. 2.3.0) hard-fail at configuration with
# "KSP is not compatible with AGP's built-in Kotlin". KSP2 uses standalone
# versioning (just 2.3.9, no <kotlin>-<ksp> suffix). Stays on Kotlin 2.3.x —
# do NOT bump Kotlin.
ksp = "2.3.9"

# Android
compileSdk = "36"
targetSdk = "36"
minSdk = "26"
jvmTarget = "17"
androidGradlePlugin = "9.2.0"
# AGP 9 dropped the implicit NDK fallback; an explicit version is required for llvm-strip. Pinned to a runner-installed NDK (detail in PR #896 / ensure-ndk action).
ndk = "27.0.12077973"

# AndroidX
androidxCore = "1.18.0"
androidxAppcompat = "1.7.1"
androidxConstraintlayout = "2.2.1"
androidxActivity = "1.13.0"
androidxFragment = "1.8.9"
androidxLifecycle = "2.10.0"
androidxNavigation = "2.9.8"
androidxWork = "2.11.2"
androidxPreference = "1.2.1"
androidxSqlite = "2.6.2"
androidxWindow = "1.5.1"

# Compose
composeBom = "2026.05.01"
composeActivity = "1.13.0"
composeConstraintlayout = "1.1.1"

# Material
material = "1.14.0"

# Hilt
# 2.59+ adds AGP 9 support to HiltGradlePlugin (2.59 "Support AGP 9 in
# HiltGradlePlugin"); 2.59.1 fixes compile errors with android.enableJetifier=true
# (this project sets it); 2.59.2 fixes slow incremental HiltSyncTask under AGP 9.
# 2.58 throws "Could not find the Android Gradle Plugin (AGP) base extension"
# once android.newDsl defaults to true (AGP 9 built-in-Kotlin migration).
hilt = "2.59.2"

# Firebase
firebaseBom = "34.13.0"
firebaseGoogleServices = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.7"
firebasePerfPlugin = "2.0.2"

# Google Play Services
playServices = "18.10.0"
playServicesAuthApiPhone = "18.3.0"

# Network
okhttp = "5.3.2"
retrofit = "3.0.0"
gson = "2.14.0"
conscrypt = "2.5.3"
bouncycastle = "1.84"

# Image Loading
glide = "5.0.7"
lottie = "6.7.1"

# UI
circleImage = "3.1.0"
binding = "1.2.0"
keyboardVisibilityEvent = "3.0.0-RC3"

# Refresh Layout
# 3.0.0-alpha: first fully-androidx release (2.1.1 referenced android.support.*,
# requiring jetifier). Only published version past 2.1.1. Alpha tag, but it's a
# self-contained pull-to-refresh widget and the API we use is stable across
# 2.x→3.0. Bump to 3.0.0 stable when released (watch
# github.com/scwang90/SmartRefreshLayout/releases) — may carry API changes.
smartRefreshLayout = "3.0.0-alpha"

# Picture Selector
pictureSelector = "v3.11.2"

dtproto = "3.1.0"
jna = "5.14.0"
signalAndroid = "0.86.5"

# Jackson
jacksonDatabind = "2.21.5"
jacksonModuleKotlin = "2.21.5"

# Other Libraries
jwtdecode = "2.0.2"
annimonStream = "1.2.2"
junit = "4.13.2"
protobuf = "3.25.5"
# 0.10.0 makes the plugin AGP 9 compatible (PR #797). 0.9.6 casts the Android
# extension to the legacy BaseExtension, which AGP 9 newDsl no longer provides
# ("Cannot cast ... LibraryExtensionImpl ... to ... BaseExtension").
protobufPlugin = "0.10.0"
libPhoneNumber = "9.0.31"
androidSvg = "1.4"
okio = "3.17.0"
reflections = "0.10.2"
leakcanary = "2.14"
securityCrypto = "1.1.0"
datastore = "1.2.1"
tink = "1.21.0"
wcdb = "2.1.15"
cameraX = "1.4.2"
zxingCore = "3.5.4"
timber = "5.0.1"
slf4j = "2.0.18"
logback = "3.0.0"

# Additional Libraries from modules
desugarJdkLibs = "2.1.5"

accompanistSystemuicontroller = "0.36.0"
coil = "3.4.0"
accompanistPermissions = "0.37.3"
livekitAndroid = "2.24.1.17"
denoiseFilter = "1.1.2"
kotlinxSerializationCore = "1.11.0"
kotlinxSerializationJson = "1.11.0"
robolectric = "4.16.1"
mockk = "1.14.9"
turbine = "1.2.1"
roborazzi = "1.63.0"
legacySupportV4 = "1.0.0"
media3 = "1.10.1"
mlkitTranslate = "17.0.3"
languageDetector = "0.6"
isoparser = "1.9.56"
mp4parserStreaming = "1.9.56"
mp4parserMuxer = "1.9.56"
anrwatchdog = "1.4.0"
profileinstaller = "1.4.1"

# Static analysis
# Detekt 2.0.0-alpha.3 chosen over 1.23.8 stable because:
#   - Project uses Kotlin 2.3.0; Detekt 1.23.8 only supports up to Kotlin 2.0.21
#   - 2.0.0-alpha.3 (released 2026-04) explicitly supports Kotlin 2.3
#   - Custom rule API is stable enough across 1.23 → 2.0 migration
# Revisit when Detekt 2.0 stable ships.
detekt = "2.0.0-alpha.3"

# Android Lint (custom checks) — pinned to AGP-matching version.
# AGP 8.13.2 → Lint 31.13.2 (convention: lint version = AGP version + 23.0.0 major).
# Bump together with androidGradlePlugin to stay ABI-compatible with the Lint
# runtime the IDE / build tool ships.
lint = "32.2.0"

[libraries]

# AndroidX Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidxPreference" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }
androidx-sqlite-ktx = { module = "androidx.sqlite:sqlite-ktx", version.ref = "androidxSqlite" }
androidx-window = { module = "androidx.window:window", version.ref = "androidxWindow" }

# AndroidX Lifecycle
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

# AndroidX Navigation
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidxNavigation" }

# AndroidX WorkManager
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }

# Material
# kotlin-test-junit (not bare kotlin-test): under AGP 9 built-in Kotlin the KGP
# auto-selection of a kotlin-test framework adapter is gone, so kotlin.test.Test
# no longer resolves to JUnit ("Unresolved reference 'Test'"). The -junit adapter
# transitively includes kotlin-test and binds kotlin.test.* to JUnit 4 (the
# project's test runner), keeping all existing `import kotlin.test.*` working.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material = { module = "androidx.compose.material:material" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "composeActivity" }
compose-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
compose-constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "composeConstraintlayout" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version = "1.3.0" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics-ktx = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics-ktx = { module = "com.google.firebase:firebase-analytics" }
firebase-perf-ktx = { module = "com.google.firebase:firebase-perf" }
firebase-messaging-ktx = { module = "com.google.firebase:firebase-messaging" }

# Google Play Services
play-services-base = { module = "com.google.android.gms:play-services-base", version.ref = "playServices" }
play-services-auth-api-phone = { module = "com.google.android.gms:play-services-auth-api-phone", version.ref = "playServicesAuthApiPhone" }

# Detekt (custom rules module)
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
# Reserved for future unit-test re-enablement once Detekt 2.0 stable lands —
# currently the detekt-test 2.0.0-alpha.3 + Kotlin 2.3.0 combination has an
# internal-ABI mismatch (StandaloneProjectFactory). See detekt-rules/build.gradle.kts.
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }

# Android Lint (custom checks module)
lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "lint" }
lint-checks = { module = "com.android.tools.lint:lint-checks", version.ref = "lint" }
lint-tests = { module = "com.android.tools.lint:lint-tests", version.ref = "lint" }

# Network
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
