# zjupure webp decoder — animated-WebP support across all API levels via @GlideModule.
# Glide 5's built-in AnimatedImageDecoder is unreliable for WebP in lists (bumptech
# #5176/#5477), so we keep this. Built for 4.16 but runs unchanged on Glide 5.0.7.
glide-webpdecoder = { module = "com.github.zjupure:webpdecoder", version = "2.7.4.16.0" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }

# UI Components
